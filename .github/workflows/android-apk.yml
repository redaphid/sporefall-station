name: android-apk

# Continuous APK CI: builds a debug APK on every push to main / PR (artifact),
# and refreshes a rolling "latest" prerelease from main. Official tagged
# releases (v1.2.3) are handled by release-apk.yml, so this workflow no longer
# triggers on tags — that avoids two workflows racing to create the same
# Release for one tag.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug APK
        run: pnpm run build:apk
        env:
          # Bake the OTA manifest endpoint so installed APKs poll the live Worker
          # origin (not the retired Pages URL). Prefer the SITE_URL repo variable;
          # fall back to the canonical custom domain.
          OTA_UPDATE_URL: ${{ vars.SITE_URL && format('{0}/ota/check', vars.SITE_URL) || 'https://sporefall.hypnodroid.com/ota/check' }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "No APK produced" >&2; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      # The artifact is a CI convenience copy; the user-facing product is the
      # release asset below. Quota outages ("Artifact storage quota has been
      # hit") must not abort the job and leave the rolling release stale.
      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sporefall-debug-apk
          if-no-files-found: error
          path: ${{ steps.apk.outputs.path }}

      - name: Stage release asset
        run: cp "${{ steps.apk.outputs.path }}" sporefall.apk

      # A release was published in the GitHub UI -> attach the APK to it.
      - name: Attach APK to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sporefall.apk --clobber

      # Tagged releases (v1.2.3) are handled by release-apk.yml.

      # Every push to main -> refresh a rolling "latest" prerelease so there is
      # always a downloadable APK for the current main, no tagging required.
      - name: Update rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --prerelease --target "$GITHUB_SHA" \
                 --title "Latest debug APK (main)" \
                 --notes "Auto-built from the latest main commit. Download sporefall.apk below."
          gh release upload latest sporefall.apk --clobber
