name: deploy-web

# Deploy the Vite web build + WebSocket relay to Cloudflare WORKERS on every push
# to main. One Worker serves the static game (Assets binding) AND hosts the
# multiplayer Durable Object (RoomDO) on the same origin — see wrangler.jsonc.
# This is the "always current" browser on-ramp for the nephews: open a URL,
# get the latest game. Independent of the native APK / OTA path.
#
# One-time setup (see docs/deploy.md):
#   1. Add repo secrets CLOUDFLARE_API_TOKEN (with the "Edit Cloudflare Workers"
#      template — Workers Scripts:Edit) and CLOUDFLARE_ACCOUNT_ID.
#   2. Set the SITE_URL repo VARIABLE to the Worker's public origin
#      (https://sporefall-station.<your-subdomain>.workers.dev or a custom
#      domain) so the OTA manifest + APK links point at the live site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Never run more than one deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy web build + relay to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm run build
        env:
          # MUST stay unset for a static deploy so the built app serves its own
          # bundled assets instead of pointing the webview at a laptop dev
          # server (see capacitor.config.ts). Set here explicitly for clarity.
          CAP_SERVER_URL: ""

      # Package the built app as an OTA bundle and publish a version manifest
      # alongside the site. Installed APKs POST to /ota/check (a Pages Function),
      # which compares against dist/ota/version.json and hands back this zip when
      # it's newer. So one push to main both deploys the web page AND ships an
      # OTA update to phones. Version derives from git (tag if present, else SHA).
      - name: Stage OTA bundle + manifest
        run: |
          set -euo pipefail
          # Incrementing integer (commit count) to match the in-app build number
          # baked by vite.config.ts, so the lobby version and OTA version line up.
          VER="$(git rev-list --count HEAD)"
          # Public origin of the Worker. SET the SITE_URL repo variable to the
          # real workers.dev subdomain (or custom domain); this fallback only
          # keeps a first deploy from failing before that variable is set.
          SITE="${SITE_URL:-https://sporefall-station.workers.dev}"
          SITE="${SITE%/}"
          mkdir -p dist/ota
          # Zip the built app (index.html at the zip root); exclude the ota/ dir
          # so the bundle never contains itself or the manifest.
          ( cd dist && zip -q -r -X "../bundle.zip" . -x "ota/*" )
          mv bundle.zip "dist/ota/${VER}.zip"
          printf '{"version":"%s","url":"%s/ota/%s.zip"}\n' "$VER" "$SITE" "$VER" > dist/ota/version.json
          echo "OTA bundle: dist/ota/${VER}.zip"
          cat dist/ota/version.json
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Self-host the Android APK on the Pages site. The repo is PRIVATE, so
      # phones can't download the GitHub release asset directly (it's auth-walled)
      # — serve the bytes from backseat-sd8.pages.dev/download/backseat.apk. Runs
      # AFTER the OTA zip so the 16 MB APK never lands inside the OTA bundle.
      # Best-effort: a fresh repo with no release still deploys the site.
      - name: Bundle the Android APK for self-hosted download
        run: |
          set -euo pipefail
          mkdir -p dist/download
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'backseat.apk' \
            --dir dist/download --clobber \
            || echo "no published release APK yet — skipping (site still deploys)"
          ls -la dist/download || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy Worker (static assets + relay Durable Object)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uploads dist/ (assets binding) + the Worker + RoomDO migration from
          # wrangler.jsonc.
          command: deploy

      - name: Print deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to $DEPLOYMENT_URL"
