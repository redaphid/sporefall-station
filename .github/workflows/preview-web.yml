name: preview-web

# Per-branch BETA builds, so risky work can be looked at without it reaching the
# live game. The standing rule this implements: conservative work goes to `main`
# (deploy-web.yml, which is what phones actually run); anything the owner might
# want to veto — combat changes, removals, new art — goes here first and he
# judges it from a URL.
#
#   https://sporefall.hypnodroid.com/betas/<slug>/
#
# <slug> is the branch's last path segment, sanitized — `preview/sequenced-mods`
# becomes `sequenced-mods`. src/app/betaSlug.ts owns that rule and is the single
# place it is defined; this workflow never re-implements it.
#
# WHAT THIS JOB DOES NOT DO: it does not deploy the Worker, touch production's
# routes, publish an OTA manifest, or shift any traffic. It builds the app with
# a beta base path and UPLOADS the files to a KV namespace, exactly like
# `pnpm run review:image` uploads a PR screenshot. Production is untouched.
#
# WHY NOT `wrangler versions upload`: it was what this workflow used to do, and
# every URL it advertised was a Cloudflare Access login page — *.workers.dev on
# this account sits behind a wildcard Access app. The job went green while the
# preview was unreachable, which is worse than having no preview job at all. The
# long version is in docs/deploy.md § "Previews".
#
# Trigger: push to preview/** (or run it by hand against any branch).

on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: read

# Previews are per-branch, so only cancel superseded runs of the SAME branch —
# unlike the deploy workflow, two different previews may build concurrently.
concurrency:
  group: preview-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Publish a beta build (no deploy, no traffic shift)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same art gate as the real deploy: a stale manifest ships silently-broken
      # art, and a preview whose art is broken for the WRONG reason wastes the
      # owner's review.
      - name: Check theme manifests against assets on disk
        run: pnpm exec vitest run src/render/themeManifestSync.test.ts

      # BETA_SLUG is what makes this a beta rather than a normal build: it sets
      # Vite's `base` to /betas/<slug>/ so index.html asks for its JavaScript at
      # /betas/<slug>/assets/… . Without it the built page would request
      # /assets/… and be answered by PRODUCTION's bundle — a 200, the right URL,
      # and the wrong build. It also switches off the service worker, which
      # would otherwise be registered with scope '/' and hijack the live game
      # for whoever opened the beta. See vite.config.ts.
      - name: Build beta bundle
        run: pnpm run build
        env:
          BETA_SLUG: ${{ github.ref_name }}
          CAP_SERVER_URL: ""

      # Upload dist/ to the BETAS KV namespace. Needs Workers KV Storage:Edit,
      # which the "Edit Cloudflare Workers" token template already includes
      # alongside the Workers Scripts:Edit that deploy-web.yml uses — the same
      # CLOUDFLARE_API_TOKEN secret, no new scope. The script refuses to publish
      # a bundle whose index.html does not reference its own base, and reads the
      # shell back out of KV to prove the upload landed. No OTA bundle and no
      # APK here on purpose: a beta must never publish an OTA manifest, or
      # installed phones would pull an unreviewed build.
      - name: Publish beta to KV
        id: publish
        run: |
          set -euo pipefail
          URL="$(pnpm exec tsx scripts/publish-beta.mts)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETA_SLUG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      # Surface the URL somewhere findable rather than making anyone read the log.
      - name: Beta URL
        env:
          URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          echo "Beta: $URL"
          {
            echo "### Beta build"
            echo
            echo "Branch \`${{ github.ref_name }}\` is live at:"
            echo
            echo "$URL"
            echo
            echo "All published betas: <https://sporefall.hypnodroid.com/betas/>"
            echo
            echo "_Nothing was deployed — this is an upload to KV. Production is unchanged._"
          } >> "$GITHUB_STEP_SUMMARY"
