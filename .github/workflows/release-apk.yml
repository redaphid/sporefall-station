name: release-apk

# Build the Android APK and publish it as a GitHub Release when a version tag
# (v1.2.3) is pushed. Players download the APK from the Releases page and
# sideload it (see docs/play.md). Independent of the web / OTA path.
#
# Signing (#30): if the release-signing secrets are present the workflow decodes
# the keystore and builds a SIGNED assembleRelease APK, so sideloaded installs
# upgrade in place and aren't flagged as debug builds. If the secrets are absent
# (e.g. a fork) it falls back to the debug build so the release never breaks.
# Required repo secrets (see docs/deploy.md "Signed release APK"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS,       ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to trigger the deploy-web workflow so the site's APK refreshes

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Decide whether we have a full signing config. We only set the flag; the
      # secret values themselves are never echoed.
      - name: Detect signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present -> building a SIGNED release APK."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets absent -> falling back to the debug APK."
          fi

      # Decode the base64 keystore secret to a file. Only runs when signing.
      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # sanity: non-empty file, but never print its contents
          test -s "$RUNNER_TEMP/release.keystore"
          echo "keystore decoded ($(wc -c < "$RUNNER_TEMP/release.keystore") bytes)"

      - name: Build SIGNED release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          CAP_SERVER_URL: ""
          OTA_UPDATE_URL: ${{ vars.SITE_URL && format('{0}/ota/check', vars.SITE_URL) || 'https://sporefall.hypnodroid.com/ota/check' }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm run build:apk:release

      - name: Build debug APK (fallback, no secrets)
        if: steps.signing.outputs.signed != 'true'
        env:
          CAP_SERVER_URL: ""
          OTA_UPDATE_URL: ${{ vars.SITE_URL && format('{0}/ota/check', vars.SITE_URL) || 'https://sporefall.hypnodroid.com/ota/check' }}
        run: pnpm run build:apk

      - name: Stage release asset
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          else
            APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          fi
          if [ -z "$APK" ]; then echo "No APK produced" >&2; exit 1; fi
          cp "$APK" backseat.apk
          ls -la backseat.apk

      # Verify the published APK is signed with a real (non-debug) certificate
      # when we intended a signed build. Fails the release if signing silently
      # fell back to debug.
      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner | sort -r | head -n1)
          "$APKSIGNER" verify --print-certs --verbose backseat.apk | tee sigcheck.txt
          if grep -qi "CN=Android Debug" sigcheck.txt; then
            echo "ERROR: APK is debug-signed but a signed release was expected." >&2
            exit 1
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: >-
            Backseat ${{ github.ref_name }}${{ steps.signing.outputs.signed == 'true' && ' (signed APK)' || ' (debug APK)' }}
          generate_release_notes: true
          files: backseat.apk

      # Close the loop: now that this release is the newest, kick the web deploy
      # so it re-bundles this APK into the public site at /download/backseat.apk.
      # Without this a new release would only reach the site on the next main push.
      - name: Refresh the self-hosted APK on the site
        run: gh workflow run deploy-web.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
