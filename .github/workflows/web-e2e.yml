name: web-e2e

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Deterministic co-op convergence + BLE bandwidth gate. Deliberately its own
  # job: no browser, no ffmpeg, no video, so it runs on every push in ~a minute
  # and never queues behind the heavy e2e rig.
  #
  # It is seeded and tick-driven (no wall clock), so unlike e2e/net-conditions.mts
  # it cannot flake under CI load. The self-test step runs FIRST and deliberately
  # corrupts the wire: if the matrix stays green on a broken wire, the build fails
  # there rather than handing us a meaningless pass.
  net-matrix:
    runs-on: ubuntu-latest
    name: Co-op convergence + bandwidth matrix
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the matrix can fail (corrupted wire must go red)
        run: pnpm run e2e:net-matrix:self-test

      - name: Co-op convergence + bandwidth matrix
        run: pnpm run e2e:net-matrix

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Pick an ephemeral port
        id: port
        run: echo "port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')" >> "$GITHUB_OUTPUT"

      - name: Build, serve, and drive the e2e proof
        run: bash e2e/run.sh
        env:
          PORT: ${{ steps.port.outputs.port }}
          E2E_SEED: "424242"

      # Proof uploads are a convenience copy; quota outages ("Artifact storage
      # quota has been hit") must not fail an otherwise-green e2e run.
      - name: Upload proof artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-proof
          if-no-files-found: error
          path: |
            e2e/output/web-e2e-*.png
            e2e/output/assets-showcase-grid.png
            e2e/output/web-game-proof.mp4
            e2e/output/web-game-proof.gif
            e2e/output/assets-showcase.mp4
            e2e/output/assets-showcase.gif
            e2e/output/gameplay-demo.mp4
            e2e/output/gameplay-demo-*.png
            e2e/output/e2e-doors.mp4
            e2e/output/e2e-doors-*.png
            e2e/output/e2e-shooting.mp4
            e2e/output/e2e-shooting-*.png
            e2e/output/e2e-mission.mp4
            e2e/output/e2e-mission-*.png

      - name: Attach proof to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            e2e/output/web-e2e-01-spawn.png \
            e2e/output/web-e2e-02-move.png \
            e2e/output/web-e2e-03-combat.png \
            e2e/output/web-e2e-04-interact-door.png \
            e2e/output/web-e2e-05-mission.png \
            e2e/output/assets-showcase-grid.png \
            e2e/output/web-game-proof.mp4 \
            e2e/output/assets-showcase.mp4 \
            --clobber
