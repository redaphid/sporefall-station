<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ecs-basic sprite pack</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0b12; font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .header {
        position: fixed; top: 28px; left: 0; right: 0; text-align: center; color: #eaeaf2;
        letter-spacing: 2px; font-size: 22px; text-shadow: 0 2px 6px #000; z-index: 5;
      }
      .header small { display: block; margin-top: 6px; font-size: 13px; color: #8a8aa0; letter-spacing: 3px; }
      .hero {
        position: absolute; opacity: 0; transform: scale(0.7);
        display: flex; flex-direction: column; align-items: center; gap: 26px;
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .hero.active { opacity: 1; }
      .hero img {
        width: 340px; height: 340px; image-rendering: auto;
        filter: drop-shadow(0 18px 30px rgba(0,0,0,0.6));
        animation: bob 2.4s ease-in-out infinite;
        background: repeating-conic-gradient(#15151f 0% 25%, #1c1c28 0% 50%) 50% / 40px 40px;
        border-radius: 12px;
      }
      .hero.active img { animation: bob 2.4s ease-in-out infinite, kenburns 4s ease-in-out infinite alternate; }
      .label { color: #fff; font-size: 30px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 2px 6px #000; }
      .sub { color: #9aa0c0; font-size: 16px; letter-spacing: 1px; margin-top: -14px; }
      .slot { color: #ffd166; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-16px) rotate(1deg); } }
      @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
      .dots { position: fixed; bottom: 34px; left: 0; right: 0; display: flex; gap: 12px; justify-content: center; z-index: 5; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #2c2c3a; transition: background 0.3s; }
      .dot.on { background: #ffd166; }
      #grid {
        position: absolute; inset: 0; display: none; opacity: 0; transition: opacity 0.8s ease;
        grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 18px; padding: 90px 60px 80px;
      }
      #grid.show { display: grid; opacity: 1; }
      .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
      .cell img { width: 150px; height: 150px; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.6)); animation: bob 2.4s ease-in-out infinite; }
      .cell .label { font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="header">STREETS OF ROGUE — ECS <small>AI-GENERATED SPRITE PACK · ecs-basic</small></div>
    <div id="stage"></div>
    <div id="grid"></div>
    <div class="dots" id="dots"></div>
    <script>
      const base = new URL('.', location.href).href
      const assets = [
        { slot: 'FLOOR TILE', file: 'sprites/concrete-floor.png', label: 'Concrete Floor', sub: 'tiles/floor' },
        { slot: 'WALL TILE', file: 'sprites/brick-wall.png', label: 'Brick Wall', sub: 'tiles/wall' },
        { slot: 'PLAYER', file: 'sprites/player.png', label: 'Player', sub: 'agents/player' },
        { slot: 'ENEMY', file: 'sprites/cop.png', label: 'Cop', sub: 'agents/cop' },
        { slot: 'ITEM', file: 'sprites/pistol.png', label: 'Pistol', sub: 'items/pistol' },
        { slot: 'PROP', file: 'sprites/wooden-crate.png', label: 'Wooden Crate', sub: 'objects/wooden-crate' },
      ]
      const stage = document.getElementById('stage')
      const dots = document.getElementById('dots')
      const heroes = assets.map((a) => {
        const h = document.createElement('div')
        h.className = 'hero'
        h.innerHTML = `<img src="${base}${a.file}" alt="${a.label}"><div class="slot">${a.slot}</div><div class="label">${a.label}</div><div class="sub">${a.sub}.png · 512²</div>`
        stage.appendChild(h)
        const d = document.createElement('div')
        d.className = 'dot'
        dots.appendChild(d)
        return h
      })
      const grid = document.getElementById('grid')
      assets.forEach((a) => {
        const c = document.createElement('div')
        c.className = 'cell'
        c.innerHTML = `<img src="${base}${a.file}"><div class="label">${a.label}</div><div class="slot">${a.slot}</div>`
        grid.appendChild(c)
      })
      const dotEls = [...dots.children]
      let i = -1
      const show = (n) => {
        heroes.forEach((h, k) => h.classList.toggle('active', k === n))
        dotEls.forEach((d, k) => d.classList.toggle('on', k === n))
      }
      const step = () => {
        i += 1
        if (i < assets.length) { show(i); return }
        heroes.forEach((h) => h.classList.remove('active'))
        dotEls.forEach((d) => d.classList.add('on'))
        grid.classList.add('show')
      }
      window.__showcaseDone = false
      step()
      const timer = setInterval(() => {
        step()
        if (i >= assets.length) { clearInterval(timer); setTimeout(() => (window.__showcaseDone = true), 3000) }
      }, 3200)
    </script>
  </body>
</html>
