# Cloudflare Pages (Direct Upload) config for the web deploy.
# Used by `.github/workflows/deploy-web.yml` and for a manual first deploy
# (`npx wrangler pages deploy` after `npm run build`). See docs/deploy.md.
#
# This is a static single-page game: SPA fallback + cache headers are handled
# by public/_redirects and public/_headers (copied into dist/ by Vite), not by
# this file.
name = "backseat"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"
